<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논문 요약 서비스</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="text/javascript">
    window.onload = () => {
      let msg = document.getElementById("msg");

      send.addEventListener("click", function () {
        // 선택한 파일 데이터 저장 ★
        let form_data = new FormData();
        // 태그 id가 'file'인 태그의 파일 갯수
        let cnt = document.getElementById('file').files.length;

        if (cnt == 0) {
          msg.innerHTML =
            '<span style="color: red">파일 선택이 안되었습니다.</span>';
          return; // 실행 종료
        }
        // form_data 객체에 file이란 이름으로 파일 객체 저장 ★
        form_data.append('file', document.getElementById('file').files[0]);

        msg.innerHTML =
          '<img src="/static/images/progress.gif" style="width: 15%; margin-top: 0px;">';
        //비동기 통신(업로드)
        fetch("http://127.0.0.1:5000/pdf_upload", {
          method: 'post',
          body: form_data
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.message) {
              msg.innerHTML = data.message;
            } else {
              msg.innerHTML = data.summary;

            }
          })

      });
    };
  </script>
</head>

<body>
  <div style="margin: 10px auto; width: 90%; text-align: center">
    <h4>업로드 논문 요약 서비스 📚</h4>
    <form>
      <div class="d-flex justify-content-center">
        <input type="file" id="file" class="btn btn-info btn-sm" style="margin-right: 5px" />

        <button type="button" id="send" class="btn btn-info btn-sm">
          업로드
        </button>
        <br />
      </div>
    </form>

    <!--  업로드 관련 메시지 출력 -->
    <div id="msg" style="margin: 20px auto; width: 800px; text-align: center"></div>
  </div>
</body>

</html>
