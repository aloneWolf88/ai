<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 추천 받기</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 이미지 기본 CSS */
    .img {
      width: 150px;
      height: 120px;
    }

    /* 빨간색 포커스 */
    .selected {
      border: 8px solid #770000;
    }

    /* 밝게하기 */
    .brighten {
      filter: brightness(140%);
    }
  </style>

  <script>
    window.onload = function () {

      let result = document.querySelector('#result');
      let processing = document.querySelector('#processing');

      //click 이벤트 설정
      send.addEventListener('click', () => {
        // 동적으로 생성된 영화이미지들 검색 
        let tags = document.querySelectorAll("[name='recommend']");
        let values = []; // 전체 이미지의 값, 서버로 전달
        let pick_count = 0; // 선택한 이미지 카운터,5개까지만
        for (let i = 0; i < tags.length; i++) { // 25번 순환
          let tag = tags[i] // 태그 추출
          let pick = tag.getAttribute("data-value"); // 0 (기본값), 1(선택시)
          values.push(pick); // 태그의 기본값인 0과 이미지 선택시 1로 변경된 값이 할당됨.

          if (pick == 1) { // 선택한 이미지이면 카운터 증가
            pick_count = pick_count + 1;
          }
        }

        if (pick_count == 5) { // 이미지가 5개 선택되면 다음으로 자동 진행
          let movie = values.join(","); // 배열의 값을 ','로 연결,[1,0,1]=>"1,0,1"
          console.log('-> movie: ' + movie)
          //처리중 이미지 표시
          processing.innerHTML = '<img src="/static/images/progress.gif" style="width: 3%; margin-top: 10px;">';
          // flask 서버로 movie 데이터 전송(비동기 통신)
          fetch("http://127.0.0.1:5000/movie", {
            method: "post",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ movie })
          })
            .then((response) => response.json())
            .then((data) => {
              result.innerHTML = '<h3>' + data['res'] + '</h3>';
              processing.innerHTML = "";
            })
          // 이미지가 5개 이상 선택되면 메시지 출력 
        } else if (pick_count > 5) {
          processing.innerHTML = "<br>이미지 선택은 5개만 가능합니다.<br>";
        } else {
          processing.innerHTML = "<br>이미지 선택이 부족합니다.<br>";
        }
      });//이벤트 설정 end
    }

    //영화이미지를 클릭했을때 호출, 
    function applyCSS(event) {
      const img = event.target; // click을 한 태그
      img.classList.toggle('selected'); // selected 클래스 추가/제거
      img.classList.toggle('brighten'); // brighten 클래스 추가/제거 

      let sw = img.getAttribute("data-value");   // 값 추출, data-: 개발자가 추가한 속성
      if (sw == 0) {
        img.setAttribute("data-value", 1);
      } else {
        img.setAttribute("data-value", 0);
      }

      result.innerHTML = "";     // 이미지 선택시 기존에 출력된 추천 영화 삭제
      processing.innerHTML = ""; // 처리중 animation 삭제
    }

  </script>
</head>

<body>
  <div style="width: 90%; margin: 30px auto; text-align: center;">
    <h3>ChatGPT 기반의 영화 추천 시스템</h3>
    <b>시청한 영화 5개를 선택하세요.</b>
  </div>

  <div style="width: 90%; margin: 30px auto; text-align: center;">
    {% for filename in filenames %}
    <img id="{{loop.index}}" name="recommend" src="/static/movie/images/{{filename}}.jpg" class="img"
      onclick="applyCSS(event)" data-value="0" />
    {% endfor %}

    <br><br>
    <div id="result"></div>
    <br>
    <button type="button" id="send" class="btn btn-info btn-sm">추천 받기</button>
    <br>
    <div id="processing"></div>
  </div>
</body>

</html>
